spring.application.name=solicitudes-pago
spring.datasource.schema = ${paf_sqlserver_schema}

# Conexion [SQLServer] PagosAF
spring.datasource.paf.driverClassName=${paf_sqlserver_driverclassname}
spring.datasource.paf.url=${paf_spring_host_url}
spring.datasource.paf.username=${paf_sqlserver_username}
spring.datasource.paf.password=${paf_sqlserver_password}
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER
spring.jpa.properties.hibernate.dialect=${paf_sqlserver_dialect}

# Conexion [Oracle] GenesysP
spring.datasource.driverClassName=${paf_oracle_driverclassname}
spring.datasource.url=${paf_oracle_url}
spring.datasource.username=${paf_oracle_username}
spring.datasource.password=${paf_oracle_password}

# Conexion [Oracle] Cored
spring.datasource.cored.driverClassName=${paf_cored_driverclassname}
spring.datasource.cored.url=${paf_cored_url}
spring.datasource.cored.username=${paf_cored_username}
spring.datasource.cored.password=${paf_cored_password}

solicitud.dias.antiguedad=7

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# URL base para local
app.base.url=${paf_app_base_url}
app.base.urlCuentaBancaria=${paf_app_base_urlCuentaBancaria}