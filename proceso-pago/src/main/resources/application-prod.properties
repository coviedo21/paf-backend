spring.application.name=proceso-pago
spring.datasource.schema=${paf_sqlserver_schema}

# Conexion [SQLServer] PagosAF
spring.datasource.paf.driverClassName=${paf_sqlserver_driverclassname}
spring.datasource.paf.url=${paf_spring_host_url}
spring.datasource.paf.username=${paf_sqlserver_username}
spring.datasource.paf.password=${paf_sqlserver_password}
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.jpa.properties.hibernate.dialect=${paf_sqlserver_dialect}

# Conexion [Oracle] ADM_CTACTE
spring.datasource.driverClassName=${paf_oracle_ctacte_driverclassname}
spring.datasource.url=${paf_oracle_ctacte_host_url}
spring.datasource.username=${paf_oracle_ctacte_username}
spring.datasource.password=${paf_oracle_ctacte_password}

# Limite de tamano del archivo individual
spring.servlet.multipart.max-file-size=10MB
 
app.base.url=${paf_app_baseSolicitud_url}
app.base.urlRetencion=${paf_app_baseRetencion_url}
app.base.urlRetencionPagos=${paf_app_baseRetencionPagos_url}
app.connectionString=${AZURE_STORAGE_CONNECTION}
app.fileShareName=${paf_fileShareName}